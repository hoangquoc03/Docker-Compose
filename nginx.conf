server {
    listen 80;

    location /users/ {
        rewrite ^/users/(.*)$ /$1 break;
        proxy_pass http://user_service:8081/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /products/ {
        rewrite ^/products/(.*)$ /$1 break;
        proxy_pass http://product_service:8082/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}