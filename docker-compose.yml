version: "3.8"

services:
  nginx_proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - user_service
      - product_service
    networks:
      - storex-net

  user_service:
    image: storex-user:latest
    expose:
      - "8081"
    networks:
      - storex-net

  product_service:
    image: storex-product:latest
    expose:
      - "8082"
    networks:
      - storex-net

networks:
  storex-net:
    driver: bridge
